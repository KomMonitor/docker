networks:
  kommonitor:
    name: kommonitor
    driver: bridge

services:
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    restart: unless-stopped
    networks:
      - kommonitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak-data -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./database/data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak-data
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
  keycloak:
    image: kommonitor/keycloak:26.7.2-postgres
    container_name: keycloak
    restart: unless-stopped
    user: "1000:0"
    read_only: true
    tmpfs:
      - /tmp
      - /opt/keycloak/data 
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
          pids: 2048
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./realms/realm-export-kommonitor.json:/opt/keycloak/data/import/realm.json
      - ../certs:/opt/keycloak/demo/certs
#    entrypoint: /opt/keycloak/bin/kc.sh start
    command:
      - --import-realm
#      - --features=admin-fine-grained-authz,scripts,token-exchange
    ports:
      - 8443:8443
    networks:
      - kommonitor
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      # KOMMONITOR_REALMS can be a comma sperated list of multiple realms.
      # KomMonitor realms will have a dedicated role policy evaluation strategy.
      - KOMMONITOR_REALMS=kommonitor 
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
#      - KC_DB=postgres
      - KC_DB_URL_HOST=keycloak-db
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=keycloak-data
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_DB_SCHEMA=public
      - KC_HOSTNAME=keycloak
      - KC_SPI_CONNECTIONS_JPA_LEGACY_MIGRATION_STRATEGY=update
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/demo/certs/cert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/demo/certs/key.pem
