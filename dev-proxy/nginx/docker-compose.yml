networks:
  kommonitor:
    name: kommonitor
    driver: bridge

services:
  kommonitor-proxy:
    image: nginx:latest
    container_name: kommonitor-proxy
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./templates/default.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - NGINX_PORT=80
      - CLIENT=kommonitor-client:80
      - CLIENT_CONFIG=kommonitor-client-config:8088
      - IMPORTER=kommonitor-importer:8087
      - DATA_MANAGEMENT=kommonitor-data-management:8085
      - SPATIAL_DATA_PROCESSOR=kommonitor-spatial-data-processor:8090
      - PROCESSES_API=kommonitor-processes-api:8099
    networks:
      - kommonitor
  redis:
    image: redis:7-alpine
    container_name: oauth2-redis
    restart: unless-stopped
    networks:
      - kommonitor
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
    container_name: oauth2-proxy
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${KEYCLOAK_URL}/realms/kommonitor

      - OAUTH2_PROXY_CLIENT_ID=prefect-ui
      - OAUTH2_PROXY_CLIENT_SECRET=${KEYCLOAK_PREFECT_UI_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_EXPIRE=0

      - OAUTH2_PROXY_REDIRECT_URL=http://${KOMMONITOR_HOST_NAME}/prefect/oauth2/callback
      - OAUTH2_PROXY_PROXY_PREFIX=/prefect/oauth2
      
      - OAUTH2_PROXY_UPSTREAM=http://prefect-server:4200
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180

      - OAUTH2_PROXY_ALLOWED_ROLES=kommonitor-creator
      - OAUTH2_PROXY_USER_ID_CLAIM=preferred_username
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_LOGGING_LEVEL=debug
      
      - OAUTH2_PROXY_LOGOUT_PATH=/prefect/oauth2/sign_out
      - OAUTH2_PROXY_LOGOUT_URL=${KEYCLOAK_URL}/realms/kommonitor/protocol/openid-connect/logout
      - OAUTH2_PROXY_POST_LOGOUT_REDIRECT_URL=http://${KOMMONITOR_HOST_NAME}/
      
      - OAUTH2_PROXY_SESSION_STORE_TYPE=redis
      - OAUTH2_PROXY_REDIS_CONNECTION_URL=redis://oauth2-redis:6379
      - OAUTH2_PROXY_SESSION_TIMEOUT=3600
      - OAUTH2_PROXY_SESSION_COOKIE_NAME=_oauth2_proxy_prefect
      - OAUTH2_PROXY_SESSION_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_SESSION_COOKIE_SAMESITE=lax
  oauth2-proxy-kommonitor:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
    container_name: oauth2-proxy-kommonitor
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${KEYCLOAK_URL}/realms/kommonitor

      - OAUTH2_PROXY_CLIENT_ID=prefect-ui
      - OAUTH2_PROXY_CLIENT_SECRET=${KEYCLOAK_PREFECT_UI_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_EXPIRE=0

      - OAUTH2_PROXY_REDIRECT_URL=http://${KOMMONITOR_HOST_NAME}/kommonitor/oauth2/callback
      - OAUTH2_PROXY_PROXY_PREFIX=/kommonitor/oauth2
      - OAUTH2_PROXY_WHITELIST_DOMAINS=localhost,${KOMMONITOR_HOST_NAME}
      
      - OAUTH2_PROXY_UPSTREAM=http://client:80
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4181

      - OAUTH2_PROXY_USER_ID_CLAIM=preferred_username
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_LOGGING_LEVEL=debug
      
      - OAUTH2_PROXY_LOGOUT_PATH=/kommonitor/oauth2/sign_out
      - OAUTH2_PROXY_LOGOUT_URL=${KEYCLOAK_URL}/realms/kommonitor/protocol/openid-connect/logout
      - OAUTH2_PROXY_POST_LOGOUT_REDIRECT_URL=http://${KOMMONITOR_HOST_NAME}/
      
      - OAUTH2_PROXY_SESSION_STORE_TYPE=redis
      - OAUTH2_PROXY_REDIS_CONNECTION_URL=redis://oauth2-redis:6379
      - OAUTH2_PROXY_SESSION_TIMEOUT=3600
      - OAUTH2_PROXY_SESSION_COOKIE_NAME=_oauth2_proxy_kommonitor
      - OAUTH2_PROXY_SESSION_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_SESSION_COOKIE_SAMESITE=lax
    networks:
      - kommonitor